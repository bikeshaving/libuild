name: Release

# The only way @b9g/libuild reaches npm - and CI can only STAGE, never make a
# version live.
#
# Trigger it from Actions -> Release -> Run workflow, or by publishing a
# GitHub Release, which creates the tag. Both entry points are real, and a
# release usually hits both: the manual run stages, and the Release that
# follows it re-runs the job against a version already on the registry. That
# second run finds nothing to stage and says so instead of failing. The job
# parks on the `npm` environment until a required reviewer approves it.
#
# What it runs is `libuild stage`: the version is uploaded to the registry in
# a not-installable state, and only a human running `npm stage approve <id>`
# (which always prompts for 2FA, CLI or website) makes it live. The npm
# trusted publisher for this repo should be restricted to stage-only, so a
# compromised workflow cannot skip the human.
#
# Staging goes through `libuild stage`, not `npm stage publish` directly. The
# root package.json carries a prepublishOnly guard that libuild itself
# installs, so a direct npm publish from the root is meant to fail. libuild
# builds, then runs npm inside dist/, adding --access public for scoped names.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1+, and staged publishing 11.15.0+
      # (libuild stage checks and says so). libuild spawns `npm`, so the
      # upgraded binary has to be the one on PATH.
      - run: npm install -g npm@latest

      - run: bun install

      # The suite's consumer-project fixtures symlink node_modules/@b9g/libuild
      # at ./dist, which is gitignored - build it or those tests dangle.
      - run: bun run src/cli.ts

      # Self-hosted: libuild's own runner executes the suite on BOTH runtimes,
      # so "libuild works under node" is a gate, not a claim. (`bun run test`
      # resolves to the same script consumers of this repo run locally.)
      - run: bun run test:all

      # A mistyped tag would otherwise publish whatever the manifest says, and
      # the GitHub Release would then claim a version npm never received.
      - name: Check the tag matches the version
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package version $PKG"
            exit 1
          fi

      # Staging the same version twice is the normal shape of a release here,
      # not a mistake: the manual run uploads it, then the GitHub Release fires
      # this job again. Only npm's already-published error is swallowed - any
      # other failure still fails the job.
      - name: Stage
        run: |
          set +e
          out="$(bun run src/cli.ts stage --provenance 2>&1)"
          code=$?
          printf '%s\n' "$out"
          if [ $code -ne 0 ] && printf '%s' "$out" | grep -q "cannot publish over the previously published versions"; then
            echo "::notice::Already on the registry - staged by an earlier run of this release. Nothing to do."
            exit 0
          fi
          exit $code
